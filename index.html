<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Equation Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#25332f; --panel:#2f403b; --panel-2:#354841;
    --chalk:#f4efe3; --chalk-dim:#b9c2b6;
    --brass:#c9a227; --brass-dim:#8f7419;
    --x:#4fb0a5; --x-dark:#2f6a63;
    --c:#e8795a; --c-dark:#a24d34;
    --line:#465550;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--chalk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding:env(safe-area-inset-top,0) 20px env(safe-area-inset-bottom,0);
    min-height:100vh;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:36px 0 60px;}
  header{text-align:center;margin-bottom:28px;}
  h1{
    font-family:'Patrick Hand',cursive; font-weight:400;
    font-size:2.7rem; margin:0 0 6px; letter-spacing:.5px;
  }
  .sub{color:var(--chalk-dim); font-size:1.02rem; margin:0 auto; max-width:560px;}
  .grid{display:grid; grid-template-columns:1.2fr 1fr; gap:28px; align-items:start;}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }

  .scale-panel{background:var(--panel); border-radius:18px; padding:22px; border:1px solid var(--line);}
  svg{width:100%; height:auto; display:block; overflow:visible;}
  #beamGroup{transform-box:fill-box; transform-origin:320px 285px; transition:transform .5s cubic-bezier(.34,1.4,.4,1);}
  .tile-x rect{fill:var(--x); stroke:var(--x-dark); stroke-width:2;}
  .tile-x text{fill:#0d2320; font-weight:700; font-size:16px;}
  .tile-c circle{fill:var(--c); stroke:var(--c-dark); stroke-width:2;}
  .tile-c text{fill:#3a160b; font-weight:700; font-size:13px;}
  .tile-frac rect{fill:var(--c); stroke:var(--c-dark); stroke-width:2;}
  .tile-frac text{fill:#3a160b; font-weight:700; font-size:13px;}
  .tile-frac-x rect{fill:var(--x); stroke:var(--x-dark); stroke-width:2;}
  .tile-frac-x text{fill:#0d2320; font-weight:700; font-size:13px;}
  .pan.bump{animation:bump .3s ease;}
  @keyframes bump{ 0%{transform:translateY(0)} 40%{transform:translateY(5px)} 100%{transform:translateY(0)} }

  .status{text-align:center; font-size:.92rem; color:var(--chalk-dim); margin-top:4px; height:1.2em;}
  .equation{
    text-align:center; font-size:1.7rem; font-weight:600; margin-top:6px;
    letter-spacing:.5px; color:var(--chalk);
  }
  .equation .eq-sign{color:var(--brass); margin:0 10px;}

  section.control-panel > div{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:18px 20px; margin-bottom:18px;
  }
  h2{
    font-family:'Patrick Hand',cursive; font-weight:400; font-size:1.35rem;
    margin:0 0 12px; color:var(--brass);
  }
  h3{font-size:.82rem; text-transform:none; color:var(--chalk-dim); margin:0 0 8px; font-weight:600;}
  .eq-inputs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:1.05rem; margin-bottom:14px;}
  .eq-inputs input{
    width:46px; padding:6px 4px; text-align:center; border-radius:6px;
    border:1px solid var(--line); background:#1c2724; color:var(--chalk); font-size:1rem;
  }
  button{
    font-family:inherit; font-size:.9rem; font-weight:600; cursor:pointer;
    border:none; border-radius:9px; padding:9px 12px; margin:4px 6px 0 0;
    background:var(--x); color:#0d2320; transition:opacity .15s, transform .1s;
  }
  button:hover:not(:disabled){transform:translateY(-1px);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  #applyEq{background:var(--brass); flex:1;}
  #randomizeBtn{background:var(--x); flex:1;}
  .setup-btns{display:flex; gap:8px;}
  .setup-btns button{width:auto; margin:0;}
  #resetBtn{background:transparent; border:1px solid var(--line); color:var(--chalk-dim); width:100%; margin-top:6px;}
  .factor-block{margin-top:12px;}
  .factor-block label{display:block; font-size:.82rem; color:var(--chalk-dim); margin-bottom:6px;}
  .factor-row{display:flex; gap:8px;}
  .factor-row input{
    width:56px; padding:6px 4px; text-align:center; border-radius:6px;
    border:1px solid var(--line); background:#1c2724; color:var(--chalk); font-size:1rem;
  }
  #multiplyBtn,#divideBtn{flex:1; margin:0; background:var(--c);}
  #multiplyBtn{background:var(--x);}
  .free-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .free-cols button{width:100%; margin:0 0 8px; padding:9px 6px;}
  .hint{color:var(--chalk-dim); font-size:.82rem; margin:8px 0 0; line-height:1.4;}

  .log ol{margin:0; padding-left:20px; max-height:150px; overflow-y:auto; font-size:.9rem; color:var(--chalk-dim);}
  .log li{margin-bottom:6px;}
  .log li:last-child{color:var(--chalk);}

  .result{
    background:linear-gradient(135deg,var(--brass-dim),var(--brass));
    color:#241d05; border-radius:14px; padding:16px 18px; font-weight:600;
  }
  .result .big{font-family:'Patrick Hand',cursive; font-size:1.6rem; display:block; margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Equation Balance</h1>
    <p class="sub">Each x-tile has a real, hidden weight. Move tiles freely and watch the scale respond — an equation is only true when both pans actually weigh the same.</p>
  </header>

  <main class="grid">
    <section class="scale-panel">
      <svg id="scaleSvg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
        <path d="M300,332 L340,332 L320,296 Z" fill="var(--brass)"/>
        <rect x="316" y="332" width="8" height="18" fill="var(--brass)"/>
        <g id="beamGroup">
          <rect x="90" y="278" width="460" height="9" rx="4" fill="var(--brass)"/>
          <line x1="140" y1="283" x2="140" y2="150" stroke="var(--line)" stroke-width="2"/>
          <line x1="500" y1="283" x2="500" y2="150" stroke="var(--line)" stroke-width="2"/>
          <rect x="58" y="150" width="164" height="176" rx="12" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
          <rect x="418" y="150" width="164" height="176" rx="12" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>
          <g id="leftPan" class="pan"></g>
          <g id="rightPan" class="pan"></g>
        </g>
      </svg>
      <div class="status" id="statusLine"></div>
      <div class="equation" id="equationDisplay"></div>
    </section>

    <section class="control-panel">
      <div class="setup">
        <h2>Set an equation</h2>
        <div class="eq-inputs">
          <input type="number" id="xL" min="0" max="6" value="2">x +
          <input type="number" id="cL" min="0" max="15" value="5">
          <span class="eq-sign">=</span>
          <input type="number" id="xR" min="0" max="6" value="1">x +
          <input type="number" id="cR" min="0" max="15" value="9">
        </div>
        <div class="setup-btns">
          <button id="applyEq">Use this equation</button>
          <button id="randomizeBtn">🎲 Random equation</button>
        </div>
        <p class="hint" id="difficultyHint"></p>
      </div>

      <div class="free">
        <h2>Move tiles freely</h2>
        <div class="free-cols">
          <div>
            <h3>Left pan</h3>
            <button data-side="L" data-what="x" data-amt="1">+ x</button>
            <button data-side="L" data-what="x" data-amt="-1">− x</button>
            <button data-side="L" data-what="c" data-amt="1">+ 1</button>
            <button data-side="L" data-what="c" data-amt="-1">− 1</button>
          </div>
          <div>
            <h3>Right pan</h3>
            <button data-side="R" data-what="x" data-amt="1">+ x</button>
            <button data-side="R" data-what="x" data-amt="-1">− x</button>
            <button data-side="R" data-what="c" data-amt="1">+ 1</button>
            <button data-side="R" data-what="c" data-amt="-1">− 1</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <h2>Balance moves</h2>
        <button id="elimX">Remove x from both sides</button>
        <button id="elimC">Remove a number from both sides</button>
        <div class="factor-block">
          <label for="factorInput">Multiply or divide both sides by</label>
          <div class="factor-row">
            <input type="number" id="factorInput" min="1" max="12" value="2">
            <button id="multiplyBtn">× Multiply</button>
            <button id="divideBtn">÷ Divide</button>
          </div>
        </div>
        <button id="resetBtn">Start over</button>
      </div>

      <div class="log">
        <h2>Steps so far</h2>
        <ol id="stepLog"></ol>
      </div>

      <div class="result" id="resultBox" hidden></div>
    </section>
  </main>
</div>

<script>
let state, origState, steps, hiddenX;

function isZero(v){ return Math.abs(v) < 1e-6; }
function isWhole(v){ return Math.abs(v-Math.round(v)) < 1e-6; }
function isOne(v){ return Math.abs(v-1) < 1e-6; }
function toFraction(x, maxDen=12){
  if(isWhole(x)) return {n:Math.round(x), d:1};
  const sign = x<0 ? -1 : 1; x=Math.abs(x);
  let h1=1,h2=0,k1=0,k2=1,b=x,a;
  for(let i=0;i<20;i++){
    a=Math.floor(b);
    [h1,h2]=[a*h1+h2,h1]; [k1,k2]=[a*k1+k2,k1];
    if(Math.abs(x-h1/k1) < 1e-9 || k1>maxDen) break;
    b = 1/(b-a);
  }
  return {n:sign*h1, d:k1};
}
function fmt(v){
  if(isWhole(v)) return String(Math.round(v));
  const f=toFraction(v);
  return f.d===1 ? String(f.n) : `${f.n}/${f.d}`;
}
function fmtFull(v){
  if(isWhole(v)) return String(Math.round(v));
  return `${fmt(v)} (\u2248${v.toFixed(2)})`;
}
function sideText(x,c){
  const parts=[];
  if(!isZero(x)){
    parts.push(isWhole(x) ? (Math.round(x)===1 ? "x" : Math.round(x)+"x") : fmt(x)+"x");
  }
  if(!isZero(c) || isZero(x)) parts.push(fmt(c));
  return parts.join(" + ");
}
function log(msg){
  steps.push(msg);
  const ol=document.getElementById("stepLog");
  ol.innerHTML = steps.map(s=>`<li>${s}</li>`).join("");
  ol.scrollTop = ol.scrollHeight;
}
function bump(){
  ["leftPan","rightPan"].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  });
}
function renderPan(groupId, xCount, cCount){
  const g=document.getElementById(groupId);
  g.innerHTML="";
  const originX = groupId==="leftPan" ? 68 : 428;
  const originY = 305;
  const perRow=4, step=36;
  let i=0;
  if(!isZero(xCount)){
    if(isWhole(xCount) && xCount<=10){
      const n=Math.round(xCount);
      for(let k=0;k<n;k++,i++){
        const row=Math.floor(i/perRow), col=i%perRow;
        const x=originX+col*step, y=originY-row*step-32;
        const grp=document.createElementNS("http://www.w3.org/2000/svg","g");
        grp.setAttribute("class","tile-x");
        grp.innerHTML = `<rect x="${x}" y="${y}" width="30" height="30" rx="6"></rect><text x="${x+15}" y="${y+20}" text-anchor="middle">x</text>`;
        g.appendChild(grp);
      }
    } else {
      const row=Math.floor(i/perRow), col=i%perRow;
      const x=originX+col*step, y=originY-row*step-32;
      const grp=document.createElementNS("http://www.w3.org/2000/svg","g");
      grp.setAttribute("class","tile-frac-x");
      grp.innerHTML = `<rect x="${x}" y="${y}" width="66" height="30" rx="6"></rect><text x="${x+33}" y="${y+20}" text-anchor="middle">${fmt(xCount)}x</text>`;
      g.appendChild(grp); i++;
    }
  }
  if(!isZero(cCount)){
    if(isWhole(cCount) && cCount<=16){
      const n=Math.round(cCount);
      for(let k=0;k<n;k++,i++){
        const row=Math.floor(i/perRow), col=i%perRow;
        const x=originX+col*step+15, y=originY-row*step-17;
        const grp=document.createElementNS("http://www.w3.org/2000/svg","g");
        grp.setAttribute("class","tile-c");
        grp.innerHTML = `<circle cx="${x}" cy="${y}" r="13"></circle><text x="${x}" y="${y+5}" text-anchor="middle">1</text>`;
        g.appendChild(grp);
      }
    } else {
      const row=Math.floor(i/perRow), col=i%perRow;
      const x=originX+col*step, y=originY-row*step-32;
      const grp=document.createElementNS("http://www.w3.org/2000/svg","g");
      grp.setAttribute("class","tile-frac");
      grp.innerHTML = `<rect x="${x}" y="${y}" width="66" height="30" rx="6"></rect><text x="${x+33}" y="${y+20}" text-anchor="middle">${fmt(cCount)}</text>`;
      g.appendChild(grp);
    }
  }
}
function weightOf(x,c){ return x*hiddenX + c; }

function render(){
  renderPan("leftPan", state.xL, state.cL);
  renderPan("rightPan", state.xR, state.cR);
  document.getElementById("equationDisplay").innerHTML =
    sideText(state.xL,state.cL) + '<span class="eq-sign">=</span>' + sideText(state.xR,state.cR);

  const wL = weightOf(state.xL,state.cL);
  const wR = weightOf(state.xR,state.cR);
  const diff = wR - wL;
  const angle = 16 * Math.tanh(diff/6);
  document.getElementById("beamGroup").style.transform = `rotate(${angle}deg)`;

  const status = document.getElementById("statusLine");
  if(Math.abs(diff) < 0.05) status.textContent = "The pans are balanced.";
  else if(diff > 0) status.textContent = "Heavier on the right — that pan sinks.";
  else status.textContent = "Heavier on the left — that pan sinks.";

  document.getElementById("elimX").disabled = !(state.xL>1e-6 && state.xR>1e-6);
  document.getElementById("elimC").disabled = !(!isZero(state.cL) && !isZero(state.cR));
  document.getElementById("multiplyBtn").disabled = false;
  document.getElementById("divideBtn").disabled = false;

  const isolatedL = isOne(state.xL) && isZero(state.cL) && isZero(state.xR);
  const isolatedR = isOne(state.xR) && isZero(state.cR) && isZero(state.xL);
  const box = document.getElementById("resultBox");
  if((isolatedL || isolatedR) && Math.abs(diff) < 0.05){
    const val = isolatedL ? state.cR : state.cL;
    const chkL = origState.xL*val+origState.cL, chkR = origState.xR*val+origState.cR;
    box.hidden=false;
    box.innerHTML = `<span class="big">x = ${fmtFull(val)}</span>Level and isolated — that's the solution. Check: ${origState.xL}(${fmt(val)}) + ${origState.cL} = ${fmt(chkL)}, and ${origState.xR}(${fmt(val)}) + ${origState.cR} = ${fmt(chkR)}.`;
    document.getElementById("elimX").disabled=true;
    document.getElementById("elimC").disabled=true;
    document.getElementById("multiplyBtn").disabled=true;
    document.getElementById("divideBtn").disabled=true;
  } else if((isolatedL || isolatedR) && Math.abs(diff) >= 0.05){
    box.hidden=false;
    box.innerHTML = `<span class="big">Not quite yet</span>The tiles look isolated, but the pans don't actually weigh the same — some earlier move wasn't applied to both sides.`;
  } else if(isZero(state.xL) && isZero(state.xR)){
    box.hidden=false;
    if(Math.abs(state.cL-state.cR)<1e-6){
      box.innerHTML = `<span class="big">x = any number</span>All the x tiles are gone and the two sides already match (${fmt(state.cL)} = ${fmt(state.cR)}). This equation is true no matter what x is.`;
    } else {
      box.innerHTML = `<span class="big">No solution</span>All the x tiles are gone, but the sides don't match (${fmt(state.cL)} \u2260 ${fmt(state.cR)}). There's no value of x that can balance this one.`;
    }
    document.getElementById("elimX").disabled=true;
    document.getElementById("elimC").disabled=true;
    document.getElementById("multiplyBtn").disabled=true;
    document.getElementById("divideBtn").disabled=true;
  } else {
    box.hidden=true;
  }
}
function applyEquation(){
  state = {
    xL:+document.getElementById("xL").value || 0,
    cL:+document.getElementById("cL").value || 0,
    xR:+document.getElementById("xR").value || 0,
    cR:+document.getElementById("cR").value || 0,
  };
  origState = {...state};
  hiddenX = (origState.xL === origState.xR) ? 1 : (origState.cR - origState.cL) / (origState.xL - origState.xR);
  steps=[];
  log(`Starting equation: ${sideText(state.xL,state.cL)} = ${sideText(state.xR,state.cR)}`);
  render();
}
document.getElementById("applyEq").onclick = applyEquation;
document.getElementById("resetBtn").onclick = applyEquation;

function randomEquation(){
  let xL,xR,cL,cR,x0;
  for(let tries=0; tries<60; tries++){
    xL = Math.floor(Math.random()*6);
    do{ xR = Math.floor(Math.random()*6); } while(xR===xL);
    cL = Math.floor(Math.random()*13);
    cR = Math.floor(Math.random()*13);
    x0 = (cR-cL)/(xL-xR);
    if(x0>=0 && x0<=10) break;
  }
  return {xL,cL,xR,cR,x0};
}
document.getElementById("randomizeBtn").onclick = ()=>{
  const eq = randomEquation();
  document.getElementById("xL").value = eq.xL;
  document.getElementById("cL").value = eq.cL;
  document.getElementById("xR").value = eq.xR;
  document.getElementById("cR").value = eq.cR;
  applyEquation();
  const hint = document.getElementById("difficultyHint");
  hint.textContent = isWhole(eq.x0) ? "New problem — this one works out to a whole number." : "New problem — this one works out to a fraction.";
};

document.getElementById("elimX").onclick = ()=>{
  const n = Math.min(state.xL, state.xR);
  if(n<=1e-6) return;
  state.xL-=n; state.xR-=n;
  log(`Removed ${fmt(n)}x from both sides.`);
  bump(); render();
};
document.getElementById("elimC").onclick = ()=>{
  const n = Math.min(state.cL, state.cR);
  if(n<=1e-6) return;
  state.cL-=n; state.cR-=n;
  log(`Removed ${fmt(n)} from both sides.`);
  bump(); render();
};
function factorVal(){
  const v = +document.getElementById("factorInput").value;
  return (v && v>0) ? v : 1;
}
function tooBig(s){ return [s.xL,s.cL,s.xR,s.cR].some(v=>Math.abs(v)>60); }
document.getElementById("multiplyBtn").onclick = ()=>{
  const n=factorVal();
  const next={xL:state.xL*n, cL:state.cL*n, xR:state.xR*n, cR:state.cR*n};
  if(tooBig(next)){ log(`That factor makes the pans too heavy to show — try a smaller one.`); return; }
  state=next;
  log(`Multiplied both sides by ${fmt(n)}.`);
  bump(); render();
};
document.getElementById("divideBtn").onclick = ()=>{
  const n=factorVal();
  state.xL/=n; state.cL/=n; state.xR/=n; state.cR/=n;
  log(`Divided both sides by ${fmt(n)}.`);
  bump(); render();
};

document.querySelectorAll('.free-cols button').forEach(btn=>{
  btn.onclick = ()=>{
    const side = btn.dataset.side, what = btn.dataset.what, amt = +btn.dataset.amt;
    const xKey = side==="L" ? "xL" : "xR", cKey = side==="L" ? "cL" : "cR";
    if(what==="x"){
      if(state[xKey]+amt < 0 || state[xKey]+amt > 8) return;
      state[xKey]+=amt;
      log(`${amt>0?"Added":"Removed"} 1 x tile ${amt>0?"to":"from"} the ${side==="L"?"left":"right"} pan.`);
    } else {
      if(state[cKey]+amt < 0 || state[cKey]+amt > 20) return;
      state[cKey]+=amt;
      log(`${amt>0?"Added":"Removed"} 1 from the ${side==="L"?"left":"right"} pan.`);
    }
    bump(); render();
  };
});

applyEquation();
</script>
</body>
</html>
